<!DOCTYPE html>
{% load static %}
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    
    <title> Inicio</title>
</head>
<body>
    <header class="barra-navegacion">
        <a class="marca" href="{% url 'index' %}"><span class="marca__simbolo"></span> Juegos indie</a>
        <nav aria-label="Navegacion principal">
            <a class="nav-link nav-link--activo" href="{% url 'index' %}">Inicio</a>
            <a class="nav-link" href="{% url 'videojuegos' %}">Videojuegos</a>
        </nav>
    </header>

    <main class="container py-5">
        <section class="row align-items-center g-5">
            <div class="col-12 col-md-6 order-md-1">
                <h1>Perfil personal</h1>
                <ul class="list-unstyled fs-5">
                    <li><strong>Nombre:</strong> {{ perfil.nombre }}</li>
                    <li><strong>Especialidad:</strong> {{ perfil.especialidad }}</li>
                    <li><strong>Edad:</strong> {{ perfil.edad }}</li>
                    <li><strong>Ciudad:</strong> {{ perfil.ciudad }}</li>
                </ul>
            </div>
            <div class="col-12 col-md-6 order-md-2">
                <img class="img-fluid w-100 rounded shadow" src="{% static 'img/x.jpg' %}" alt="Fotografía o avatar de {{ perfil.nombre }}">
            </div>
        </section>
    </main>
</body>
</html>
